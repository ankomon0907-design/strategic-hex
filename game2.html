<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Strategic Hex Explosion - Absolute Full Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ========================================
           UI スタイル設定（全デザインを完全に維持）
           ========================================
        */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1a1a1a;
        }

        #home-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2d2d2d 0%, #1a1a1a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s;
            font-family: 'Segoe UI', sans-serif;
        }

        #home-layer.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .home-title {
            font-size: 72px; font-weight: bold; color: #00ffcc;
            text-shadow: 0 0 30px rgba(0,255,204,0.6);
            letter-spacing: 12px; margin-bottom: 60px;
        }

        .home-menu { display: grid; grid-template-columns: repeat(2, 280px); gap: 25px; }
        
        .home-btn {
            padding: 30px; background: rgba(255,255,255,0.05); border: 1px solid #444;
            border-radius: 15px; color: white; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: 0.3s; text-align: center;
            backdrop-filter: blur(10px);
        }
        .home-btn:hover {
            background: #00ffcc; color: #000; transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0,255,204,0.5);
        }
        .home-btn.main {
            grid-column: span 2;
            background: linear-gradient(90deg, #00ffcc, #0099ff); color: #000;
        }

        #return-home-overlay {
            position: fixed; top: 10px; right: 10px; z-index: 99998;
            background: rgba(68, 68, 68, 0.8); color: white;
            padding: 6px 14px; border-radius: 4px; cursor: pointer;
            font-size: 11px; display: none; border: 1px solid #666;
        }

        :root {
            --p1-color: #ff4d4d;
            --p2-color: #4d79ff;
            --bg-dark: #1a1a1a;
            --panel-bg: #2d2d2d;
            --accent: #00ffcc;
            --fire: #ff5e3a; --water: #3a8cff; --earth: #a67c52;
            --thunder: #f3d100; --wind: #4ade80; --abyss: #a855f7;
        }

        #game-container {
            display: flex; width: 100vw; height: 100vh;
            overflow: hidden; background: var(--bg-dark);
            color: #eee; font-family: 'Segoe UI', sans-serif;
            visibility: hidden;
        }

        #left-sidebar, #right-sidebar {
            width: 300px; background: var(--panel-bg);
            border: 2px solid #444; display: flex; flex-direction: column;
            padding: 15px; box-sizing: border-box;
        }

        .status-box {
            background: #111; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border-left: 5px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #detail-panel {
            background: #222; border: 1px solid var(--accent);
            border-radius: 8px; padding: 10px; margin-bottom: 10px;
            font-size: 12px; display: none;
            box-shadow: inset 0 0 10px rgba(0,255,204,0.1);
        }

        .hp-display { font-size: 24px; font-weight: bold; }
        .p1-text { color: var(--p1-color); }
        .p2-text { color: var(--p2-color); }

        #log {
            flex-grow: 1; background: #111; padding: 10px; border-radius: 5px;
            font-size: 11px; overflow-y: auto; color: #bbb;
            border: 1px solid #444; margin-bottom: 10px;
        }

        #main-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        #board {
            display: grid; grid-template-columns: repeat(4, 110px);
            grid-template-rows: repeat(4, 110px); gap: 12px;
            background: #333; padding: 15px; border-radius: 15px;
        }

        .cell {
            width: 110px; height: 110px; background: #222;
            border: 1px solid #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .cell:hover { background: #333; }
        .cell.highlight { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent); z-index: 10; }

        .card-on-board {
            width: 100%; height: 100%; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 8px; box-sizing: border-box; font-size: 10px;
            transition: 0.3s; position: relative;
        }

        .owner-p1 { border: 3px solid var(--p1-color); box-shadow: 0 0 10px var(--p1-color); }
        .owner-p2 { border: 3px solid var(--p2-color); box-shadow: 0 0 10px var(--p2-color); }

        .attr-fire { background: linear-gradient(135deg, var(--fire), #ff8e71); color: #fff; }
        .attr-water { background: linear-gradient(135deg, var(--water), #71b1ff); color: #fff; }
        .attr-earth { background: linear-gradient(135deg, var(--earth), #c29b74); color: #fff; }
        .attr-thunder { background: linear-gradient(135deg, var(--thunder), #fff071); color: #000; }
        .attr-wind { background: linear-gradient(135deg, var(--wind), #8dffba); color: #000; }
        .attr-abyss { background: linear-gradient(135deg, var(--abyss), #d49aff); color: #fff; }

        .fatigued { filter: grayscale(0.8) brightness(0.7); }
        .fatigue-timer {
            position: absolute; bottom: 4px; right: 4px;
            background: rgba(0,0,0,0.8); color: #ffcc00;
            border-radius: 50%; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 10px; border: 1px solid #ffcc00;
        }

        .card-ui {
            padding: 10px; border-radius: 8px; color: white;
            cursor: pointer; transition: 0.2s; border: 2px solid transparent;
            margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-ui.selected { border: 2px solid var(--accent); transform: scale(1.02); }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            background: var(--accent); color: #000; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { filter: brightness(1.2); }
        button.active-mode { outline: 3px solid white; }

        .hp-bar-small {
            background: rgba(0,0,0,0.5); padding: 2px 4px;
            border-radius: 4px; font-weight: bold; display: inline-block;
        }
    </style>
</head>
<body>

    <div id="home-layer">
        <div class="home-title">STRATEGIC HEX</div>
        <div class="home-menu">
            <div style="grid-column: span 2; display: flex; gap: 10px; margin-bottom: 15px;">
                <input id="room-id-input" type="text" placeholder="好きな部屋番号を入力" 
                       style="flex:1; padding: 20px; border-radius: 12px; border: 2px solid #444; background: #222; color: #00ffcc; font-size: 18px;">
            </div>
            <div class="home-btn" onclick="createRoom()">部屋を作る (P1)</div>
            <div class="home-btn" onclick="joinRoom()">部屋に入る (P2)</div>
            <div class="home-btn main" onclick="initApp()">LOCAL 対戦</div>
        </div>
    </div>
    
    <div id="return-home-overlay" onclick="location.reload()">HOMEに戻る</div>

    <div id="game-container">
        <div id="left-sidebar">
            <div class="status-box">
                <div id="turn-label" style="color: var(--accent); font-size: 12px; letter-spacing: 2px; margin-bottom:5px;">TURN 1</div>
                <div class="hp-display p1-text">P1: <span id="p1-hp">25</span></div>
                <div class="hp-display p2-text">P2: <span id="p2-hp">25</span></div>
                <div style="font-size: 12px; margin-top:5px;">配置残数: <span id="deploy-count" style="color:var(--accent)">2</span></div>
            </div>
            <div id="detail-panel"></div>
            <div id="log"></div>
            <div class="btn-group">
                <button id="skill-btn">スキル発動</button>
                <button id="end-phase-btn">ターン終了</button>
            </div>
        </div>
        <div id="main-area">
            <div id="board"></div>
        </div>
        <div id="right-sidebar">
            <div style="text-align:center; padding: 10px; font-weight:bold; letter-spacing: 2px; border-bottom:1px solid #444; margin-bottom:10px;">HAND</div>
            <div id="hand" style="overflow-y:auto; flex-grow:1;"></div>
        </div>
    </div>

<script>
    /* ========================================
       オンライン通信・ハンドシェイク
       ========================================
    */
    let peer = null, conn = null, myPlayerRole = 'p1', isOnlineMode = false;

    function createRoom() {
        const id = document.getElementById('room-id-input').value;
        if (!id) return alert("部屋名を入力");
        peer = new Peer(id);
        myPlayerRole = 'p1'; isOnlineMode = true;
        peer.on('open', () => alert("部屋作成: " + id));
        peer.on('connection', c => { conn = c; setupConnection(); });
    }

    function joinRoom() {
        const id = document.getElementById('room-id-input').value;
        if (!id) return alert("部屋名を入力");
        peer = new Peer();
        myPlayerRole = 'p2'; isOnlineMode = true;
        peer.on('open', () => { conn = peer.connect(id); setupConnection(); });
    }

    function setupConnection() {
        conn.on('open', () => { if (myPlayerRole === 'p2') conn.send({ type: 'READY' }); });
        conn.on('data', data => {
            if (data.type === 'READY' && myPlayerRole === 'p1') {
                initApp();
                conn.send({ type: 'SYNC', decks: JSON.parse(JSON.stringify(window.game.deck)) });
            } else if (data.type === 'SYNC') {
                initApp(data.decks);
            } else {
                window.game.handleRemoteAction(data);
            }
        });
    }

    function initApp(syncedDecks = null) {
        document.getElementById('home-layer').classList.add('hidden');
        document.getElementById('return-home-overlay').style.display = 'block';
        document.getElementById('game-container').style.visibility = 'visible';
        window.game = new StrategicGame(syncedDecks);
    }

    /* ========================================
       全36種カードプール定義
       ========================================
    */
    const ATTRS = ['FIRE', 'WIND', 'EARTH', 'THUNDER', 'WATER', 'ABYSS'];
    const CARD_POOL = [
        { id: "f1", name: "焔の尖兵", attr: "FIRE", dur: 2, exp: 1, type: "PASSIVE", ability: "攻撃時、自身の攻撃+1", destruction: "敵ランダムに1ダメ" },
        { id: "f2", name: "火走りの策士", attr: "FIRE", dur: 3, exp: 1, type: "PASSIVE", ability: "囲み条件緩和(1方向)", destruction: "自分HP-1" },
        { id: "f3", name: "紅蓮の剣士", attr: "FIRE", dur: 5, exp: 2, type: "PASSIVE", ability: "有利属性に+1ダメ", destruction: "敵プレイヤーに1ダメ" },
        { id: "f4", name: "焦熱の号令", attr: "FIRE", dur: 4, exp: 2, type: "PASSIVE", ability: "隣接炎の攻撃+1", destruction: "自分の炎1体に1ダメ" },
        { id: "f5", name: "煉獄の巨兵", attr: "FIRE", dur: 8, exp: 4, type: "PASSIVE", ability: "攻撃対象の隣接敵にも1ダメ", destruction: "自分HP-3" },
        { id: "f6", name: "終炎の王", attr: "FIRE", dur: 9, exp: 5, type: "PASSIVE", ability: "攻撃時+2", destruction: "自分盤面1体破壊" },
        { id: "w1", name: "潤水の癒し手", attr: "WATER", dur: 2, exp: 2, type: "PASSIVE", ability: "ターン終了時自分HP+1", destruction: "なし" },
        { id: "w2", name: "流転の盾", attr: "WATER", dur: 3, exp: 1, type: "PASSIVE", ability: "隣接味方の耐久+1", destruction: "隣接味方-1耐久" },
        { id: "w3", name: "深流の守護者", attr: "WATER", dur: 6, exp: 2, type: "PASSIVE", ability: "被ダメ-1", destruction: "自分HP-1" },
        { id: "w4", name: "蒼波の転換者", attr: "WATER", dur: 5, exp: 2, type: "PASSIVE", ability: "攻撃時、自分HP+1", destruction: "相手HP+1" },
        { id: "w5", name: "海嘯の大精霊", attr: "WATER", dur: 8, exp: 3, type: "PASSIVE", ability: "攻撃した敵の攻撃-1", destruction: "自分HP-2" },
        { id: "w6", name: "静寂の守護神", attr: "WATER", dur: 9, exp: 4, type: "PASSIVE", ability: "サドンデス攻撃不可/爆ダメ-1", destruction: "自分HP-2" },
        { id: "t1", name: "閃光の刺客", attr: "THUNDER", dur: 2, exp: 1, type: "ACTIVE", ability: "【発動】疲労中も可/味方(耐久4以下)の疲労回復", destruction: "なし" },
        { id: "t2", name: "電圧操作士", attr: "THUNDER", dur: 3, exp: 1, type: "ACTIVE", ability: "【発動】敵1体を疲労させる", destruction: "自身も疲労" },
        { id: "t3", name: "雷撃の槍兵", attr: "THUNDER", dur: 4, exp: 2, type: "PASSIVE", ability: "有利属性に+2ダメ", destruction: "自分HP-1" },
        { id: "t4", name: "轟雷の司令", attr: "THUNDER", dur: 5, exp: 2, type: "ACTIVE", ability: "【発動】今ターン疲労なし", destruction: "次ターン行動不可" },
        { id: "t5", name: "雷神の化身", attr: "THUNDER", dur: 8, exp: 4, type: "PASSIVE", ability: "攻撃後もう1回攻撃可", destruction: "自分HP-3" },
        { id: "t6", name: "終末の雷鳴", attr: "THUNDER", dur: 9, exp: 5, type: "PASSIVE", ability: "攻撃対象の周囲全体1ダメ", destruction: "味方全体-1耐久" },
        { id: "n1", name: "疾風の伝令", attr: "WIND", dur: 2, exp: 1, type: "ACTIVE", ability: "【発動】隣接マスへ移動", destruction: "なし" },
        { id: "n2", name: "風読みの策士", attr: "WIND", dur: 3, exp: 1, type: "PASSIVE", ability: "斜め干渉可能", destruction: "自分HP-1" },
        { id: "n3", name: "旋風の剣士", attr: "WIND", dur: 4, exp: 2, type: "PASSIVE", ability: "移動後攻撃可能", destruction: "なし" },
        { id: "n4", name: "風圧の結界師", attr: "WIND", dur: 5, exp: 2, type: "PASSIVE", ability: "隣接敵の攻撃-1", destruction: "敵全体攻撃+1" },
        { id: "n5", name: "天翔ける竜", attr: "WIND", dur: 8, exp: 4, type: "PASSIVE", ability: "全盤面射程", destruction: "自分HP-2" },
        { id: "n6", name: "乱気流の支配者", attr: "WIND", dur: 9, exp: 4, type: "PASSIVE", ability: "敵配置時に1ダメ", destruction: "ランダム移動" },
        { id: "e1", name: "岩盾の兵", attr: "EARTH", dur: 3, exp: 1, type: "PASSIVE", ability: "囲み時さらに+1ダメ", destruction: "なし" },
        { id: "e2", name: "根張りの精霊", attr: "EARTH", dur: 2, exp: 1, type: "PASSIVE", ability: "移動不可/被ダメ-1", destruction: "自分HP-1" },
        { id: "e3", name: "大地の戦士", attr: "EARTH", dur: 6, exp: 2, type: "PASSIVE", ability: "隣接味方耐久+1", destruction: "隣接味方-1耐久" },
        { id: "e4", name: "岩盤の陣形師", attr: "EARTH", dur: 5, exp: 2, type: "PASSIVE", ability: "囲み条件緩和", destruction: "次ターン囲み無効" },
        { id: "e5", name: "山岳巨人", attr: "EARTH", dur: 9, exp: 4, type: "PASSIVE", ability: "被ダメ-1", destruction: "自分HP-3" },
        { id: "e6", name: "大地神の化身", attr: "EARTH", dur: 8, exp: 4, type: "PASSIVE", ability: "隣接味方は爆ダメ-1", destruction: "自分盤面1体破壊" },
        { id: "a1", name: "闇縛りの影", attr: "ABYSS", dur: 2, exp: 1, type: "PASSIVE", ability: "攻撃対象の能力封印", destruction: "なし" },
        { id: "a2", name: "深淵の囁き", attr: "ABYSS", dur: 3, exp: 1, type: "ACTIVE", ability: "【発動】敵の爆ダメ+1", destruction: "自分HP-1" },
        { id: "a3", name: "呪刻の司祭", attr: "ABYSS", dur: 4, exp: 2, type: "PASSIVE", ability: "敵爆発時に追加1ダメ", destruction: "相手HP+1" },
        { id: "a4", name: "奈落の操者", attr: "ABYSS", dur: 5, exp: 2, type: "PASSIVE", ability: "敵の破壊効果無効", destruction: "自分HP-1" },
        { id: "a5", name: "深淵竜", attr: "ABYSS", dur: 8, exp: 4, type: "PASSIVE", ability: "爆ダメ2倍", destruction: "自分HP-3" },
        { id: "a6", name: "終焉の審判者", attr: "ABYSS", dur: 9, exp: 5, type: "PASSIVE", ability: "敵爆発時自分HP+1", destruction: "自分HP-4" }
    ];

    /* ========================================
       ゲームコアロジック
       ========================================
    */
    class StrategicGame {
        constructor(syncedDecks) {
            this.board = Array(16).fill(null);
            this.hp = { p1: 25, p2: 25 };
            this.hand = { p1: [], p2: [] };
            this.deck = syncedDecks || { p1: this.shuffle([...CARD_POOL]), p2: this.shuffle([...CARD_POOL]) };
            this.turn = 1; this.currentPlayer = 'p1';
            this.deployLimit = 2; this.currentDeployCount = 0;
            this.selectedHandIdx = null; this.selectedBoardIdx = null;
            this.isSkillMode = false; this.isSuddenDeath = false;
            this.skipNextTurn = { p1: false, p2: false };
            this.chainDisabled = { p1: false, p2: false };
            this.waitingTarget = null;

            this.initBoard();
            this.draw('p1', 5); this.draw('p2', 5);
            
            document.getElementById('end-phase-btn').onclick = () => this.action({ type: 'END' });
            document.getElementById('skill-btn').onclick = () => { this.isSkillMode = !this.isSkillMode; this.updateUI(); };
            this.updateUI();
        }

        shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
        draw(p, n=1) { for(let i=0; i<n; i++) if(this.deck[p].length && this.hand[p].length < 10) this.hand[p].push({...this.deck[p].pop(), currentDur: 0, owner: p, attackBonus: 0, extraExp: 0, fatigued: false, timer: 0}); }

        initBoard() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for(let i=0; i<16; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => this.cellClick(i); b.appendChild(c);
            }
        }

        // --- 同期アクション送信 ---
        action(data) {
            if (isOnlineMode && this.currentPlayer !== myPlayerRole) return;
            data.actor = this.currentPlayer; // 誰が実行したかを付与
            if (isOnlineMode && conn) conn.send(data);
            this.handleRemoteAction(data);
        }

        // --- 同期アクション受信・実行 ---
        handleRemoteAction(data) {
            console.log("Recv:", data);
            if (data.type === 'DEPLOY') this.execDeploy(data.idx, data.handIdx, data.actor);
            if (data.type === 'MOVE') this.execMove(data.from, data.to);
            if (data.type === 'ATTACK') this.execAttack(data.from, data.to);
            if (data.type === 'SKILL') this.execSkill(data.ownerIdx, data.targetIdx, data.skillType);
            if (data.type === 'END') this.nextTurn();
            this.updateUI();
        }

        cellClick(i) {
            if (isOnlineMode && this.currentPlayer !== myPlayerRole) return;
            const card = this.board[i];
            if (card) this.showDetail(card);

            // スキル待機中
            if (this.waitingTarget) {
                this.action({ type: 'SKILL', ownerIdx: this.waitingTarget.ownerIdx, targetIdx: i, skillType: this.waitingTarget.type });
                this.waitingTarget = null; this.isSkillMode = false; return;
            }

            // スキルモード
            if (this.isSkillMode) {
                if (card && card.owner === this.currentPlayer) this.prepareSkill(i);
                return;
            }

            // 配置
            if (this.selectedHandIdx !== null && !card) {
                if (this.currentDeployCount >= this.deployLimit) return;
                this.action({ type: 'DEPLOY', idx: i, handIdx: this.selectedHandIdx });
                return;
            }

            // 選択・移動・攻撃
            if (card && card.owner === this.currentPlayer) {
                if (card.fatigued && card.id !== "t1") return;
                this.selectedBoardIdx = (this.selectedBoardIdx === i) ? null : i;
                this.selectedHandIdx = null;
            } else if (this.selectedBoardIdx !== null) {
                const target = this.board[i];
                if (!target && this.canMove(this.selectedBoardIdx, i)) {
                    this.action({ type: 'MOVE', from: this.selectedBoardIdx, to: i });
                } else if (target && target.owner !== this.currentPlayer && this.canAtk(this.selectedBoardIdx, i)) {
                    this.action({ type: 'ATTACK', from: this.selectedBoardIdx, to: i });
                }
                this.selectedBoardIdx = null;
            }
            this.updateUI();
        }

        execDeploy(i, handIdx, actor) {
            const card = this.hand[actor].splice(handIdx, 1)[0];
            card.currentDur = card.dur; card.fatigued = true; card.timer = 1;
            this.board[i] = card;
            if (actor === this.currentPlayer) this.currentDeployCount++;
            this.selectedHandIdx = null;
            this.log(`${actor}: ${card.name}配置`);
        }

        execMove(f, t) {
            const c = this.board[f]; this.board[t] = c; this.board[f] = null;
            c.fatigued = true; c.timer = 1;
            this.log(`${c.name}移動`);
        }

        execAttack(f, t) {
            const a = this.board[f], d = this.board[t];
            let dmg = 1 + a.attackBonus;
            const aIdx = ATTRS.indexOf(a.attr), dIdx = ATTRS.indexOf(d.attr);
            if ((aIdx + 1) % 6 === dIdx) dmg += (a.id === "f3" ? 1 : a.id === "t3" ? 2 : 1);
            if (this.countAdj(t, a.owner) >= 2) dmg += (a.id === "e1" ? 2 : 1);
            if (this.isSuddenDeath) dmg += 2;
            
            this.log(`${a.name}が${d.name}に${dmg}ダメ`);
            this.damage(t, dmg);
            a.fatigued = true; a.timer = (a.id === "t5" ? 1 : 2);
        }

        damage(i, val) {
            const c = this.board[i]; if(!c) return;
            c.currentDur -= val;
            if(c.currentDur <= 0) this.explode(i);
        }

        explode(i) {
            const c = this.board[i];
            const dmg = c.exp + (this.isSuddenDeath ? 1 : 0);
            this.hp[c.owner] -= dmg;
            this.log(`${c.name}爆発! ${c.owner}に${dmg}ダメ`);
            this.board[i] = null; this.checkWin();
        }

        prepareSkill(i) {
            const c = this.board[i];
            if (c.id === "t1") this.waitingTarget = { ownerIdx: i, type: 'HEAL_F' };
            else if (c.id === "t2") this.waitingTarget = { ownerIdx: i, type: 'STUN' };
            else if (c.id === "n1") { this.selectedBoardIdx = i; this.isSkillMode = false; }
            else if (c.id === "a2") this.waitingTarget = { ownerIdx: i, type: 'CURSE' };
            this.updateUI();
        }

        execSkill(oIdx, tIdx, type) {
            const owner = this.board[oIdx], target = this.board[tIdx];
            if (type === 'HEAL_F' && target) { target.fatigued = false; target.timer = 0; }
            if (type === 'STUN' && target) { target.fatigued = true; target.timer = 2; }
            if (type === 'CURSE' && target) { target.extraExp += 1; }
            if (owner) { owner.fatigued = true; owner.timer = 1; }
        }

        nextTurn() {
            this.currentPlayer = (this.currentPlayer === 'p1' ? 'p2' : 'p1');
            if (this.currentPlayer === 'p1') { this.turn++; if(this.turn > 10) this.isSuddenDeath = true; }
            this.currentDeployCount = 0; this.draw(this.currentPlayer);
            this.board.forEach(c => { if(c && c.owner === this.currentPlayer && c.fatigued) { c.timer--; if(c.timer <= 0) c.fatigued = false; } });
            this.log(`ターン ${this.turn}: ${this.currentPlayer}`);
            this.checkWin();
        }

        checkWin() { if(this.hp.p1 <= 0 || this.hp.p2 <= 0) { alert("Game Over"); location.reload(); } }

        countAdj(idx, owner) {
            let n = 0; const x = idx%4, y = Math.floor(idx/4);
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                const nx = x+dx, ny = y+dy;
                if(nx>=0 && nx<4 && ny>=0 && ny<4) { const t = this.board[ny*4+nx]; if(t && t.owner === owner) n++; }
            }); return n;
        }

        canMove(f, t) { return Math.abs(f%4 - t%4) + Math.abs(Math.floor(f/4) - Math.floor(t/4)) === 1; }
        canAtk(f, t) { return this.canMove(f, t) || (this.board[f].id === "n5"); }

        log(m) { const l = document.getElementById('log'); l.innerHTML = `<div>> ${m}</div>` + l.innerHTML; }
        showDetail(c) {
            const p = document.getElementById('detail-panel'); p.style.display = 'block';
            p.innerHTML = `<b>${c.name}</b> [${c.attr}]<br>HP: ${c.currentDur}/${c.dur}<br>${c.ability}`;
        }

        updateUI() {
            document.getElementById('p1-hp').innerText = this.hp.p1;
            document.getElementById('p2-hp').innerText = this.hp.p2;
            document.getElementById('turn-label').innerText = `TURN ${this.turn} - ${this.currentPlayer.toUpperCase()}`;
            document.getElementById('deploy-count').innerText = (2 - this.currentDeployCount);
            
            document.querySelectorAll('.cell').forEach((cell, i) => {
                cell.className = 'cell' + (this.selectedBoardIdx === i ? ' highlight' : '');
                cell.innerHTML = '';
                const c = this.board[i];
                if (c) {
                    const el = document.createElement('div');
                    el.className = `card-on-board attr-${c.attr.toLowerCase()} owner-${c.owner} ${c.fatigued ? 'fatigued' : ''}`;
                    el.innerHTML = `<div>${c.name}</div><div class="hp-bar-small">HP ${c.currentDur}</div>`;
                    if(c.fatigued) { const t = document.createElement('div'); t.className='fatigue-timer'; t.innerText=c.timer; el.appendChild(t); }
                    cell.appendChild(el);
                }
            });

            const h = document.getElementById('hand'); h.innerHTML = '';
            // 重要：オンライン時は常に「自分の手札」を表示、ローカル時は「ターン中のプレイヤーの手札」を表示
            const viewP = isOnlineMode ? myPlayerRole : this.currentPlayer;
            this.hand[viewP].forEach((c, i) => {
                const d = document.createElement('div');
                d.className = `card-ui attr-${c.attr.toLowerCase()} ${this.selectedHandIdx === i ? 'selected' : ''}`;
                d.innerHTML = `<b>${c.name}</b><br><small>${c.ability.substring(0,15)}...</small>`;
                d.onclick = (e) => {
                    if (isOnlineMode && this.currentPlayer !== myPlayerRole) return;
                    e.stopPropagation(); this.selectedHandIdx = (this.selectedHandIdx === i) ? null : i; this.updateUI();
                };
                h.appendChild(d);
            });
        }
    }
</script>
</body>
</html>
