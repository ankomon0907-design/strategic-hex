<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Strategic Hex Explosion - Absolute Full Logic Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ==========================================================================
           UI STYLING:
           ここでのスタイル記述は、ゲームの視覚的フィードバックだけでなく、

           ==========================================================================
        */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #home-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2d2d2d 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        #home-layer.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .home-title {
            font-size: 80px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5), 0 0 40px rgba(0, 255, 204, 0.3);
            letter-spacing: 15px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .home-menu {
            display: grid;
            grid-template-columns: repeat(2, 300px);
            gap: 30px;
        }
        
        .home-btn {
            padding: 35px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #444;
            border-radius: 20px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            backdrop-filter: blur(15px);
        }

        .home-btn:hover {
            background: #00ffcc;
            color: #000;
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 45px rgba(0, 255, 204, 0.4);
            border-color: #00ffcc;
        }

        .home-btn.main {
            grid-column: span 2;
            background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
            color: #000;
            border: none;
        }

        #room-id-input {
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #333;
            background: #000;
            color: #00ffcc;
            font-size: 20px;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        #room-id-input:focus {
            border-color: #00ffcc;
        }

        #return-home-overlay {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 99998;
            background: rgba(50, 50, 50, 0.9);
            color: #00ffcc;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: none;
            border: 1px solid #00ffcc;
            font-weight: bold;
        }

        :root {
            --p1-color: #ff4d4d;
            --p2-color: #4d79ff;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --accent: #00ffcc;
            --fire: #ff5e3a;
            --water: #3a8cff;
            --earth: #a67c52;
            --thunder: #f3d100;
            --wind: #4ade80;
            --abyss: #a855f7;
        }

        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-dark);
            visibility: hidden;
        }

        #left-sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .status-box {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hp-display {
            font-size: 28px;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .p1-text { color: var(--p1-color); text-shadow: 0 0 10px rgba(255,77,77,0.3); }
        .p2-text { color: var(--p2-color); text-shadow: 0 0 10px rgba(77,121,255,0.3); }

        #detail-panel {
            background: #252525;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            border-top: 4px solid var(--accent);
        }

        #log {
            flex-grow: 1;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            font-size: 11px;
            overflow-y: auto;
            color: #999;
            border: 1px solid #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, 120px);
            grid-template-rows: repeat(4, 120px);
            gap: 15px;
            background: rgba(40, 40, 40, 0.8);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #444;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .cell {
            width: 120px;
            height: 120px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            background: #222;
            border-color: #666;
        }

        .cell.highlight {
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
            z-index: 10;
        }

        .card-on-board {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            font-size: 11px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 5;
        }

        .owner-p1 { border: 4px solid var(--p1-color); }
        .owner-p2 { border: 4px solid var(--p2-color); }

        .attr-fire { background: linear-gradient(135deg, var(--fire), #ff8e71); color: #fff; }
        .attr-water { background: linear-gradient(135deg, var(--water), #71b1ff); color: #fff; }
        .attr-earth { background: linear-gradient(135deg, var(--earth), #c29b74); color: #fff; }
        .attr-thunder { background: linear-gradient(135deg, var(--thunder), #fff071); color: #000; }
        .attr-wind { background: linear-gradient(135deg, var(--wind), #8dffba); color: #000; }
        .attr-abyss { background: linear-gradient(135deg, var(--abyss), #d49aff); color: #fff; }

        .fatigued {
            filter: grayscale(0.9) contrast(0.8);
            opacity: 0.8;
        }

        .fatigue-timer {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.85);
            color: #ffcc00;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #right-sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-ui {
            padding: 15px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            margin-bottom: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .card-ui:hover {
            transform: translateX(-10px);
        }

        .card-ui.selected {
            border-color: var(--accent);
            transform: scale(1.05) translateX(-5px);
            box-shadow: 0 0 20px var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active-mode {
            background: #fff;
            box-shadow: 0 0 20px #fff;
            color: #000;
        }

        .hp-bar-small {
            background: rgba(0,0,0,0.6);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 900;
            display: inline-block;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ANIMATIONS 
        */
        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; background: #fff; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="home-layer">
        <div class="home-title">STRATEGIC HEX</div>
        <div class="home-menu">
            <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 10px;">
                <input id="room-id-input" type="text" placeholder="ROOM ID (部屋番号)" maxlength="12">
            </div>
            <div class="home-btn" onclick="createRoom()">CREATE ROOM (P1)</div>

            <div class="home-btn main" onclick="initApp()">LOCAL BATTLE</div>
        </div>

        <div id="right-sidebar">
            <div style="text-align:center; padding: 10px; font-weight:900; font-size:18px; color:var(--accent); letter-spacing: 5px; border-bottom:2px solid #333; margin-bottom:15px;">HAND</div>

<script>
    /* ==========================================================================
       JAVASCRIPT GAME ENGINE: 840行以上の密度を維持
       ==========================================================================
    */

    let peer = null;
    let conn = null;
    let myPlayerRole = 'p1'; 
    let isOnlineMode = false;

    // --- PeerJS オンライン基盤 ---
    function createRoom() {
        const roomId = document.getElementById('room-id-input').value;
        if (!roomId) {
            alert("部屋番号を入力してください。");
            return;
        }
        peer = new Peer(roomId);
        myPlayerRole = 'p1';
        isOnlineMode = true;
        peer.on('open', (id) => {
            console.log("Room Created Successfully. ID:", id);
            alert("部屋を作成しました。待機中です...\nID: " + id);
        });
        peer.on('connection', (c) => {
            conn = c;
            initializeConnectionHandlers();
        });
        peer.on('error', (err) => {
            alert("通信エラーが発生しました: " + err.type);
        });
    }

    function joinRoom() {
        const roomId = document.getElementById('room-id-input').value;
        if (!roomId) {
            alert("部屋IDを入力してください。");
            return;
        }
        peer = new Peer();
        myPlayerRole = 'p2';
        isOnlineMode = true;
        peer.on('open', (id) => {
            conn = peer.connect(roomId);
            initializeConnectionHandlers();
            conn.on('open', () => {
                console.log("Connected to Player 1. Sending hand-shake...");
                conn.send({ type: 'P2_READY_SIGNAL' });
            });
        });
        peer.on('error', (err) => {
            alert("接続に失敗しました: " + err.type);
        });
    }

    function initializeConnectionHandlers() {
        conn.on('data', (data) => {
            console.log("Data Received:", data);
            
            // 同期ポイント1: P2が準備完了したとき、P1がデッキ情報を同期する
            if (data.type === 'P2_READY_SIGNAL' && myPlayerRole === 'p1') {
                initApp();
                const p1Ids = window.gameInstance.deck.p1.map(c => c.id);
                const p2Ids = window.gameInstance.deck.p2.map(c => c.id);
                conn.send({ type: 'MASTER_SYNC_START', p1Ids, p2Ids });
                return;
            }

            // 同期ポイント2: P2がP1から送られたデッキ情報でアプリを起動する
            if (data.type === 'MASTER_SYNC_START') {
                initApp(data);
                return;
            }

            // 同期ポイント3: 盤面アクションの完全同期
            if(window.gameInstance) {
                window.gameInstance.handleRemoteAction(data);
            }
        });

        conn.on('close', () => {
            alert("相手プレイヤーとの接続が切れました。");
            location.reload();
        });
    }

    function initApp(syncData = null) {
        document.getElementById('home-layer').classList.add('hidden');

        { id: "a2", name: "深淵の囁き", attr: "ABYSS", dur: 3, exp: 1, type: "ACTIVE", ability: "【スキル】敵の爆発ダメージを+1する", destruction: "自分プレイヤーに1ダメージ" },
        { id: "a3", name: "呪刻の司祭", attr: "ABYSS", dur: 4, exp: 2, type: "PASSIVE", ability: "敵爆発時、追加で1ダメージ与える", destruction: "相手プレイヤーのHP+1" },
        { id: "a4", name: "奈落の操者", attr: "ABYSS", dur: 5, exp: 2, type: "PASSIVE", ability: "敵の破壊効果をすべて無効化する", destruction: "自分プレイヤーに1ダメージ" },
        { id: "a5", name: "深淵竜", attr: "ABYSS", dur: 8, exp: 4, type: "PASSIVE", ability: "自分の爆発ダメージを2倍にする", destruction: "自分プレイヤーに3ダメージ" },
        { id: "a6", name: "終焉の審判者", attr: "ABYSS", dur: 9, exp: 5, type: "PASSIVE", ability: "敵爆発時、自分のプレイヤーHP+2", destruction: "自分プレイヤーに4ダメージ" }
    ];

    // --- ゲームエンジン本体 ---
    class StrategicGame {
        constructor(syncData = null) {
            // ステートの初期化
            this.board = Array(16).fill(null);
            this.hp = { p1: 25, p2: 25 };
            this.hand = { p1: [], p2: [] };
            this.deck = { p1: [], p2: [] };
            
            this.turn = 1;
            this.currentPlayer = 'p1';
            this.deployLimit = 2;
            this.currentDeployCount = 0;
            
            this.selectedHandIdx = null;
            this.selectedBoardIdx = null;
            this.isSkillMode = false;
            this.isSuddenDeath = false;
            this.waitingForSkillTarget = null;
            
            // 特殊状態管理
            this.skipNextTurn = { p1: false, p2: false };
            this.chainBonusDisabled = { p1: false, p2: false };

            // デッキの初期化シーケンス
            this.initializeDeckAndHands(syncData);

            // UIとイベントのバインド
            this.initBoardElement();
            this.bindInputEvents();
            
            this.updateUI();
            this.log("戦略ヘクス・エクスプロージョンへようこそ。");
        }

        initializeDeckAndHands(syncData) {
            if (syncData) {
                // 通信同期による山札生成（IDから完全復元）
                this.deck.p1 = syncData.p1Ids.map(id => this.createCardInstance(id));
                this.deck.p2 = syncData.p2Ids.map(id => this.createCardInstance(id));
                this.log("対戦相手とデッキ情報を同期しました。");
            } else {
                // ローカルまたはホスト：全カードをシャッフルして配布
                const p1Source = MASTER_CARDS.map(c => c.id).sort(() => Math.random() - 0.5);
                const p2Source = MASTER_CARDS.map(c => c.id).sort(() => Math.random() - 0.5);
                
                this.deck.p1 = p1Source.map(id => this.createCardInstance(id));
                this.deck.p2 = p2Source.map(id => this.createCardInstance(id));
            }

            // 初期手札を5枚ずつ引く
            this.drawCardToHand('p1', 5);
            this.drawCardToHand('p2', 5);
        }

        createCardInstance(id) {
            const master = MASTER_CARDS.find(c => c.id === id);
            return {
                ...master,
                currentDur: master.dur,
                owner: null,
                isFatigued: false,
                fatigueTimer: 0,
                attackBonus: 0,
                extraExplosionDamage: 0,
                hasMovedThisTurn: false,
                hasAttackedThisTurn: false,
                usedThunderSpecial: false,
                isSilenced: false,
                uniqueId: 'card_' + Math.random().toString(36).substr(2, 9)
            };
        }

        initBoardElement() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => this.handleCellInteraction(i);
                b.appendChild(cell);
            }
        }

        bindInputEvents() {
            document.getElementById('end-phase-btn').onclick = () => {
                this.broadcastAction({ type: 'CMD_NEXT_TURN' });
            };
            document.getElementById('skill-btn').onclick = () => {
                this.toggleSkillInputMode();
            };
        }

        // --- 同期アクションマネージャー ---
        broadcastAction(actionData) {
            if (isOnlineMode && this.currentPlayer !== myPlayerRole) {
                this.log("警告: 相手のターン中です。");
                return;
            }
            if (isOnlineMode && conn) {
                conn.send(actionData);
            }
            this.executeAction(actionData);
        }

        handleRemoteAction(actionData) {
            this.executeAction(actionData);
        }

        executeAction(data) {
            console.log("Execute:", data.type);
            switch(data.type) {
                case 'CMD_DEPLOY': 
                    this.performDeploy(data.hIdx, data.bIdx); 
                    break;
                case 'CMD_MOVE': 
                    this.performMove(data.from, data.to); 
                    break;
                case 'CMD_ATTACK': 
                    this.performAttack(data.from, data.to); 
                    break;
                case 'CMD_NEXT_TURN': 
                    this.performTurnTransition(); 
                    break;
                case 'CMD_SKILL_USE': 
                    this.performSkillLogic(data.targetIdx, data.payload); 
                    break;
                case 'CMD_SPECIAL_T4': 
                    if(this.board[data.idx]) this.board[data.idx].usedThunderSpecial = true; 
                    break;
            }
            this.updateUI();
        }

        // --- 核心ロジック：セル操作 ---
        handleCellInteraction(idx) {
            if (isOnlineMode && this.currentPlayer !== myPlayerRole) return;
            
            const cardInCell = this.board[idx];
            if (cardInCell) this.renderDetailPanel(cardInCell);

            // 1. スキルターゲット選択中
            if (this.waitingForSkillTarget) {
                this.broadcastAction({ 
                    type: 'CMD_SKILL_USE', 
                    targetIdx: idx, 
                    payload: this.waitingForSkillTarget 
                });
                this.waitingForSkillTarget = null;
                this.isSkillMode = false;
                return;
            }

            // 2. スキル発動モード
            if (this.isSkillMode) {
                if (cardInCell && cardInCell.owner === this.currentPlayer) {
                    this.initiateSkillFlow(idx);
                }
                return;
            }

            // 3. 手札からの配置
            if (this.selectedHandIdx !== null && !cardInCell) {
                if (this.currentDeployCount < this.deployLimit) {
                    this.broadcastAction({ 
                        type: 'CMD_DEPLOY', 
                        hIdx: this.selectedHandIdx, 
                        bIdx: idx 
                    });
                } else {
                    this.log("このターンはこれ以上配置できません。");
                }
                return;
            }

            // 4. 駒の選択、移動、攻撃
            if (cardInCell && cardInCell.owner === this.currentPlayer) {
                // 疲労チェック（刺客以外）
                if (cardInCell.isFatigued && cardInCell.id !== "t1") {
                    this.log("その駒は疲労しています。");
                    return;
                }
                this.selectedBoardIdx = (this.selectedBoardIdx === idx) ? null : idx;
                this.selectedHandIdx = null;
            } else if (this.selectedBoardIdx !== null) {
                const activeCard = this.board[this.selectedBoardIdx];
                if (!cardInCell) {
                    if (this.checkMoveValidity(this.selectedBoardIdx, idx)) {
                        this.broadcastAction({ type: 'CMD_MOVE', from: this.selectedBoardIdx, to: idx });
                    }
                } else if (cardInCell.owner !== this.currentPlayer) {
                    if (this.checkAttackValidity(this.selectedBoardIdx, idx)) {
                        this.broadcastAction({ type: 'CMD_ATTACK', from: this.selectedBoardIdx, to: idx });
                    }
                }
                this.selectedBoardIdx = null;
            }
            this.updateUI();
        }

        // --- 具体的なアクション実行 ---
        performDeploy(hIdx, bIdx) {
            const card = this.hand[this.currentPlayer].splice(hIdx, 1)[0];
            card.owner = this.currentPlayer;
            // 配置直後は疲労状態
            card.isFatigued = true;
            card.fatigueTimer = 1;
            this.board[bIdx] = card;
            this.currentDeployCount++;
            this.selectedHandIdx = null;
            this.log(`${card.name} を配置しました。`);
        }

        performMove(f, t) {
            const card = this.board[f];
            this.board[t] = card;
            this.board[f] = null;
            card.hasMovedThisTurn = true;
            
            // 旋風の剣士以外は移動で疲労
            if (card.id !== "n3") {
                card.isFatigued = true;
                card.fatigueTimer = 1;
            }
            this.log(`${card.name} が移動。`);
        }

        performAttack(f, t) {
            const attacker = this.board[f];
            const defender = this.board[t];
            if (!attacker || !defender) return;

            let finalDamage = 1 + attacker.attackBonus;
            
            // 属性相性の計算
            const atkAttrIdx = ATTRS.indexOf(attacker.attr);
            const defAttrIdx = ATTRS.indexOf(defender.attr);
            if ((atkAttrIdx + 1) % 6 === defAttrIdx) {
                // 有利属性への特効
                let bonus = 1;
                if (attacker.id === "f3") bonus = 2;
                if (attacker.id === "t3") bonus = 3;
                finalDamage += bonus;
            }

            // 囲みボーナスの計算
            if (!this.chainBonusDisabled[this.currentPlayer]) {
                let requiredAllies = (attacker.id === "f2" || attacker.id === "e4") ? 1 : 2;
                if (this.countAlliesNearby(t, attacker.owner) >= requiredAllies) {
                    finalDamage += (attacker.id === "e1" ? 2 : 1);
                }
            }

            // 防御アビリティの適用
            if (["w3", "e2", "e5"].includes(defender.id)) {
                finalDamage = Math.max(1, finalDamage - 1);
            }

            // サドンデス補正
            if (this.isSuddenDeath) finalDamage += 2;

            this.log(`${attacker.name} の攻撃！ ${finalDamage}ダメージ。`);
            this.applyDamageToCard(t, finalDamage);

            // 行動終了後の処理
            attacker.hasAttackedThisTurn = true;
            if (!attacker.usedThunderSpecial) {
                attacker.isFatigued = true;
                attacker.fatigueTimer = (attacker.id === "t5") ? 1 : 2;
            }
            attacker.usedThunderSpecial = false;
        }

        applyDamageToCard(idx, amt) {
            const card = this.board[idx];
            if (!card) return;
            card.currentDur -= amt;
            if (card.currentDur <= 0) {
                this.triggerCardDestruction(idx);
            }
        }

        triggerCardDestruction(idx) {
            const card = this.board[idx];
            this.log(`警告: ${card.name} が限界を超え爆発した！`);
            
            let power = card.exp + card.extraExplosionDamage;
            if (card.id === "a5") power *= 2;
            if (this.isSuddenDeath) power += 1;

            // 所有者にダメージ
            this.hp[card.owner] -= power;

            // 破壊時固有スキル
            if (card.id === "f3") {
                const enemy = card.owner === 'p1' ? 'p2' : 'p1';
                this.hp[enemy] -= 1;
                this.log("紅蓮の呪いが敵プレイヤーを襲う。");
            }
            if (card.id === "f5") this.hp[card.owner] -= 3;
            if (card.id === "t4") this.skipNextTurn[card.owner] = true;
            
            // 爆発エフェクトをシミュレート
            this.board[idx] = null;
            this.checkWinConditions();
        }

        performSkillLogic(tIdx, data) {
            const targetCard = this.board[tIdx];
            const ownerCard = this.board[data.ownerIdx];
            if (!ownerCard) return;

            if (data.type === 'SKILL_RECOVER' && targetCard) {
                targetCard.isFatigued = false;
                targetCard.fatigueTimer = 0;
            } else if (data.type === 'SKILL_STUN' && targetCard) {
                targetCard.isFatigued = true;
                targetCard.fatigueTimer = 2;
            } else if (data.type === 'SKILL_CURSE' && targetCard) {
                targetCard.extraExplosionDamage += 1;
            }

            // スキル使用者は疲労する
            ownerCard.isFatigued = true;
            ownerCard.fatigueTimer = 1;
            this.log(`${ownerCard.name} の特殊能力が発動。`);
        }

        // --- ターン推移 ---
        performTurnTransition() {
            // ターン終了時効果の解決
            this.board.forEach(c => {
                if (c && c.owner === this.currentPlayer) {
                    if (c.id === "w1") {
                        this.hp[this.currentPlayer]++;
                        this.log(`${c.name} によりプレイヤーが癒やされた。`);
                    }
                }
            });

            // プレイヤー交代
            this.currentPlayer = (this.currentPlayer === 'p1' ? 'p2' : 'p1');
            
            // 休み状態の確認
            if (this.skipNextTurn[this.currentPlayer]) {
                this.skipNextTurn[this.currentPlayer] = false;
                this.log(`${this.currentPlayer.toUpperCase()} はショックで動けない！`);
                return this.performTurnTransition();
            }

            // ターンカウントの更新
            if (this.currentPlayer === 'p1') {
                this.turn++;
                if (this.turn >= 14) {
                    this.isSuddenDeath = true;
                    this.log("!!! SUDDEN DEATH MODE !!!");
                }
            }

            // サドンデスダメージ
            if (this.isSuddenDeath) {
                this.hp.p1--;
                this.hp.p2--;
            }

            // リソース回復
            this.currentDeployCount = 0;
            this.drawCardToHand(this.currentPlayer);
            
            // 盤面ユニットの回復
            this.board.forEach(unit => {
                if (unit && unit.owner === this.currentPlayer) {
                    unit.hasMovedThisTurn = false;
                    unit.hasAttackedThisTurn = false;
                    if (unit.isFatigued) {
                        unit.fatigueTimer--;
                        if (unit.fatigueTimer <= 0) {
                            unit.isFatigued = false;
                        }
                    }
                }
            });

            this.checkWinConditions();
        }

        // --- ヘルパー・ユーティリティ ---
        drawCardToHand(player, amount = 1) {
            for(let i = 0; i < amount; i++) {
                if(this.deck[player].length > 0 && this.hand[player].length < 10) {
                    const card = this.deck[player].pop();
                    this.hand[player].push(card);
                }
            }
        }

        checkMoveValidity(f, t) {
            const card = this.board[f];
            if (!this.areCellsAdjacent(f, t)) return false;
            // 疾風の伝令、旋風の剣士のみ移動可能
            return (card.id === "n1" || card.id === "n3") && !card.hasMovedThisTurn;
        }

        checkAttackValidity(f, t) {
            const card = this.board[f];
            // 天翔ける竜は射程無限
            if (card.id === "n5") return true;
            return this.areCellsAdjacent(f, t);
        }

        areCellsAdjacent(i1, i2) {
            const x1 = i1 % 4, y1 = Math.floor(i1 / 4);
            const x2 = i2 % 4, y2 = Math.floor(i2 / 4);
            const dx = Math.abs(x1 - x2);
            const dy = Math.abs(y1 - y2);
            // 通常の隣接判定
            return (dx + dy === 1);
        }

        countAlliesNearby(idx, owner) {
            let allies = 0;
            const x = idx % 4;
            const y = Math.floor(idx / 4);
            const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
            
            dirs.forEach(([dx, dy]) => {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < 4 && ny >= 0 && ny < 4) {
                    const occupant = this.board[ny * 4 + nx];
                    if (occupant && occupant.owner === owner) allies++;
                }
            });
            return allies;
        }

        checkWinConditions() {
            if (this.hp.p1 <= 0 || this.hp.p2 <= 0) {
                const winner = this.hp.p1 > this.hp.p2 ? "PLAYER 1" : "PLAYER 2";
                if (this.hp.p1 === this.hp.p2) {
                    alert("引き分けです！");
                } else {
                    alert(`決着！ 勝者: ${winner}`);
                }
                location.reload();
            }
        }

        log(message) {
            const l = document.getElementById('log');
            const entry = document.createElement('div');
            entry.style.borderBottom = "1px solid #222";
            entry.style.padding = "2px 0";
            entry.innerHTML = `<span style="color:var(--accent)">[Turn ${this.turn}]</span> ${message}`;
            l.insertBefore(entry, l.firstChild);
        }

        toggleSkillInputMode() {
            this.isSkillMode = !this.isSkillMode;
            this.updateUI();
        }

        initiateSkillFlow(idx) {
            const c = this.board[idx];
            // 各カードのスキル定義を詳細に分岐
            if (c.id === "t1") {
                this.waitingForSkillTarget = { type: 'SKILL_RECOVER', ownerIdx: idx };
                this.log("回復対象を選択してください。");
            } else if (c.id === "t2") {
                this.waitingForSkillTarget = { type: 'SKILL_STUN', ownerIdx: idx };
                this.log("スタンさせる敵を選択してください。");
            } else if (c.id === "t4") {
                this.broadcastAction({ type: 'CMD_SPECIAL_T4', idx: idx });
                this.isSkillMode = false;
            } else if (c.id === "n1") {
                this.selectedBoardIdx = idx;
                this.isSkillMode = false;
                this.log("移動先を選択してください。");
            } else if (c.id === "a2") {
                this.waitingForSkillTarget = { type: 'SKILL_CURSE', ownerIdx: idx };
                this.log("呪う敵を選択してください。");
            } else {
                this.log("この駒には発動型スキルがありません。");
                this.isSkillMode = false;
            }
            this.updateUI();
        }

        renderDetailPanel(c) {
            const p = document.getElementById('detail-panel');
            p.style.display = 'block';
            p.innerHTML = `
                <div style="color:var(--accent); font-weight:900; font-size:16px; margin-bottom:5px;">${c.name}</div>
                <div style="color:#fff; margin-bottom:8px;">属性: ${c.attr} | 耐久: ${c.currentDur}/${c.dur} | 爆発力: ${c.exp}</div>
                <div style="background:#111; padding:8px; border-radius:5px; color:#aaa; font-size:11px; border-left:3px solid var(--accent);">
                    ${c.ability}
                </div>
            `;
        }

        updateUI() {
            // ステータス更新
            document.getElementById('p1-hp').innerText = this.hp.p1;
            document.getElementById('p2-hp').innerText = this.hp.p2;
            document.getElementById('turn-label').innerText = `TURN ${this.turn} - ${this.currentPlayer.toUpperCase()}`;
            document.getElementById('deploy-count').innerText = 2 - this.currentDeployCount;
            document.getElementById('skill-btn').className = this.isSkillMode ? 'active-mode' : '';

            // 盤面描写
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.className = 'cell' + (this.selectedBoardIdx === i ? ' highlight' : '');
                cell.innerHTML = '';
                const unit = this.board[i];
                if (unit) {
                    const uEl = document.createElement('div');
                    uEl.className = `card-on-board attr-${unit.attr.toLowerCase()} owner-${unit.owner} ${unit.isFatigued ? 'fatigued' : ''}`;
                    uEl.innerHTML = `
                        <div style="font-weight:900; font-size:10px;">${unit.name}</div>
                        <div class="hp-bar-small">HP ${unit.currentDur}</div>
                    `;
                    if(unit.isFatigued) {
                        const t = document.createElement('div');
                        t.className = 'fatigue-timer';
                        t.innerText = unit.fatigueTimer;
                        uEl.appendChild(t);
                    }
                    cell.appendChild(uEl);
                }
            });

            // 手札描写
            const handContainer = document.getElementById('hand');
            handContainer.innerHTML = '';
            this.hand[this.currentPlayer].forEach((card, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card-ui attr-${card.attr.toLowerCase()} ${this.selectedHandIdx === idx ? 'selected' : ''}`;
                cardDiv.innerHTML = `
                    <div style="font-weight:900; font-size:13px;">${card.name}</div>
                    <div style="font-size:10px; margin-top:3px; opacity:0.8;">耐久:${card.dur} 爆発:${card.exp}</div>
                `;
                cardDiv.onclick = (event) => {
                    if (isOnlineMode && this.currentPlayer !== myPlayerRole) return;
                    event.stopPropagation();
                    this.selectedHandIdx = (this.selectedHandIdx === idx) ? null : idx;
                    this.selectedBoardIdx = null;
                    this.updateUI();
                };
                handContainer.appendChild(cardDiv);
            });
        }
    }
