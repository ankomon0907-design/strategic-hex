<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Strategic Hex Explosion - FULL LOGIC EDITION</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* UIデザイン（完全に維持） */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        #home-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #2d2d2d 0%, #1a1a1a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Segoe UI', sans-serif; }
        #home-layer.hidden { opacity: 0; visibility: hidden; }
        .home-title { font-size: 72px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 30px rgba(0,255,204,0.6); letter-spacing: 12px; margin-bottom: 60px; }
        .home-menu { display: grid; grid-template-columns: repeat(2, 280px); gap: 25px; }
        .home-btn { padding: 30px; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 15px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(10px); }
        .home-btn:hover { background: #00ffcc; color: #000; transform: scale(1.05); box-shadow: 0 0 40px rgba(0,255,204,0.5); }
        .home-btn.main { grid-column: span 2; background: linear-gradient(90deg, #00ffcc, #0099ff); color: #000; }
        :root { --p1-color: #ff4d4d; --p2-color: #4d79ff; --bg-dark: #1a1a1a; --panel-bg: #2d2d2d; --accent: #00ffcc; --fire: #ff5e3a; --water: #3a8cff; --earth: #a67c52; --thunder: #f3d100; --wind: #4ade80; --abyss: #a855f7; }
        #game-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-dark); color: #eee; font-family: 'Segoe UI', sans-serif; visibility: hidden; }
        #left-sidebar, #right-sidebar { width: 300px; background: var(--panel-bg); border: 2px solid #444; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .status-box { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--accent); }
        #detail-panel { background: #222; border: 1px solid var(--accent); border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 12px; min-height: 80px; }
        #log { flex-grow: 1; background: #111; padding: 10px; border-radius: 5px; font-size: 11px; overflow-y: auto; color: #bbb; border: 1px solid #444; margin-bottom: 10px; }
        #board { display: grid; grid-template-columns: repeat(4, 110px); grid-template-rows: repeat(4, 110px); gap: 12px; background: #333; padding: 15px; border-radius: 15px; }
        .cell { width: 110px; height: 110px; background: #222; border: 1px solid #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .cell.highlight { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent); z-index: 10; }
        .card-on-board { width: 100%; height: 100%; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; box-sizing: border-box; font-size: 10px; position: relative; }
        .owner-p1 { border: 3px solid var(--p1-color); box-shadow: 0 0 10px var(--p1-color); }
        .owner-p2 { border: 3px solid var(--p2-color); box-shadow: 0 0 10px var(--p2-color); }
        .attr-fire { background: linear-gradient(135deg, var(--fire), #ff8e71); }
        .attr-water { background: linear-gradient(135deg, var(--water), #71b1ff); }
        .attr-earth { background: linear-gradient(135deg, var(--earth), #c29b74); }
        .attr-thunder { background: linear-gradient(135deg, var(--thunder), #fff071); color: #000; }
        .attr-wind { background: linear-gradient(135deg, var(--wind), #8dffba); color: #000; }
        .attr-abyss { background: linear-gradient(135deg, var(--abyss), #d49aff); }
        .fatigued { filter: grayscale(0.8) brightness(0.6); }
        .fatigue-timer { position: absolute; bottom: 5px; right: 5px; background: #000; color: #ffcc00; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #ffcc00; }
        .card-ui { padding: 10px; border-radius: 8px; color: white; cursor: pointer; border: 2px solid transparent; margin-bottom: 8px; background: #333; }
        .card-ui.selected { border: 2px solid var(--accent); transform: scale(1.02); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="home-layer">
        <div class="home-title">STRATEGIC HEX</div>
        <div class="home-menu">
            <input id="room-id-input" type="text" placeholder="部屋ID" style="grid-column: span 2; padding: 15px; border-radius: 10px; background: #222; color: #00ffcc; border: 1px solid #444;">
            <div class="home-btn" onclick="hostRoom()">部屋を作る</div>
            <div class="home-btn" onclick="joinRoom()">部屋に入る</div>
        </div>
    </div>

    <div id="game-container">
        <div id="left-sidebar">
            <div class="status-box">
                <div id="turn-display" style="color: var(--accent); font-weight: bold;">TURN 1</div>
                <div class="p1-text">P1 HP: <span id="p1-hp">25</span></div>
                <div class="p2-text">P2 HP: <span id="p2-hp">25</span></div>
                <div style="font-size: 11px; margin-top: 5px;">残り配置: <span id="deploy-limit">2</span></div>
            </div>
            <div id="detail-panel">カードをタッチして詳細表示</div>
            <div id="log"></div>
            <button id="skill-btn">スキル発動モード</button>
            <button id="end-btn" style="background: #ff4d4d; color: white;">ターン終了</button>
        </div>
        <div id="main-area"><div id="board"></div></div>
        <div id="right-sidebar">
            <div style="text-align:center; margin-bottom:10px;">YOUR HAND</div>
            <div id="hand"></div>
        </div>
    </div>

<script>
    /* ----------------------------------------------------------------
       1. 通信・基本設定
    ---------------------------------------------------------------- */
    let peer, conn, myRole = 'p1', isOnline = false;
    const ATTRS = ['FIRE', 'WIND', 'EARTH', 'THUNDER', 'WATER', 'ABYSS'];

    // 全36種カードプール（一切の省略なし）
    const FULL_POOL = [
        { id: "f1", name: "焔の尖兵", attr: "FIRE", dur: 2, exp: 1, type: "PASSIVE", ability: "攻撃時、自身の攻撃+1", destruction: "敵ランダムに1ダメ" },
        { id: "f2", name: "火走りの策士", attr: "FIRE", dur: 3, exp: 1, type: "PASSIVE", ability: "囲み条件緩和(1方向)", destruction: "自分HP-1" },
        { id: "f3", name: "紅蓮の剣士", attr: "FIRE", dur: 5, exp: 2, type: "PASSIVE", ability: "有利属性に+1ダメ", destruction: "敵プレイヤーに1ダメ" },
        { id: "f4", name: "焦熱の号令", attr: "FIRE", dur: 4, exp: 2, type: "PASSIVE", ability: "隣接炎の攻撃+1", destruction: "自分の炎1体に1ダメ" },
        { id: "f5", name: "煉獄の巨兵", attr: "FIRE", dur: 8, exp: 4, type: "PASSIVE", ability: "攻撃対象の隣接敵にも1ダメ", destruction: "自分HP-3" },
        { id: "f6", name: "終炎の王", attr: "FIRE", dur: 9, exp: 5, type: "PASSIVE", ability: "攻撃時+2", destruction: "自分盤面1体破壊" },
        { id: "w1", name: "潤水の癒し手", attr: "WATER", dur: 2, exp: 2, type: "PASSIVE", ability: "ターン終了時自分HP+1", destruction: "なし" },
        { id: "w2", name: "流転の盾", attr: "WATER", dur: 3, exp: 1, type: "PASSIVE", ability: "隣接味方の耐久+1", destruction: "隣接味方-1耐久" },
        { id: "w3", name: "深流の守護者", attr: "WATER", dur: 6, exp: 2, type: "PASSIVE", ability: "被ダメ-1", destruction: "自分HP-1" },
        { id: "w4", name: "蒼波の転換者", attr: "WATER", dur: 5, exp: 2, type: "PASSIVE", ability: "攻撃時、自分HP+1", destruction: "相手HP+1" },
        { id: "w5", name: "海嘯の大精霊", attr: "WATER", dur: 8, exp: 3, type: "PASSIVE", ability: "攻撃した敵の攻撃-1", destruction: "自分HP-2" },
        { id: "w6", name: "静寂の守護神", attr: "WATER", dur: 9, exp: 4, type: "PASSIVE", ability: "サドンデス攻撃不可/爆ダメ-1", destruction: "自分HP-2" },
        { id: "t1", name: "閃光の刺客", attr: "THUNDER", dur: 2, exp: 1, type: "ACTIVE", ability: "【発動】疲労回復(味方耐久4以下)", destruction: "なし" },
        { id: "t2", name: "電圧操作士", attr: "THUNDER", dur: 3, exp: 1, type: "ACTIVE", ability: "【発動】敵1体を疲労させる", destruction: "自身も疲労" },
        { id: "t3", name: "雷撃の槍兵", attr: "THUNDER", dur: 4, exp: 2, type: "PASSIVE", ability: "有利属性に+2ダメ", destruction: "自分HP-1" },
        { id: "t4", name: "轟雷の司令", attr: "THUNDER", dur: 5, exp: 2, type: "ACTIVE", ability: "【発動】全味方 今ターン疲労なし", destruction: "次ターン行動不可" },
        { id: "t5", name: "雷神の化身", attr: "THUNDER", dur: 8, exp: 4, type: "PASSIVE", ability: "攻撃後もう1回攻撃可", destruction: "自分HP-3" },
        { id: "t6", name: "終末の雷鳴", attr: "THUNDER", dur: 9, exp: 5, type: "PASSIVE", ability: "攻撃対象の周囲全体1ダメ", destruction: "味方全体-1耐久" },
        { id: "n1", name: "疾風の伝令", attr: "WIND", dur: 2, exp: 1, type: "ACTIVE", ability: "【発動】隣接マスへ瞬時に移動", destruction: "なし" },
        { id: "n2", name: "風読みの策士", attr: "WIND", dur: 3, exp: 1, type: "PASSIVE", ability: "斜め位置の敵にも干渉可能", destruction: "自分HP-1" },
        { id: "n3", name: "旋風の剣士", attr: "WIND", dur: 4, exp: 2, type: "PASSIVE", ability: "移動した直後に攻撃可能", destruction: "なし" },
        { id: "n4", name: "風圧の結界師", attr: "WIND", dur: 5, exp: 2, type: "PASSIVE", ability: "隣接敵の攻撃力を-1する", destruction: "敵全体攻撃+1" },
        { id: "n5", name: "天翔ける竜", attr: "WIND", dur: 8, exp: 4, type: "PASSIVE", ability: "全盤面が射程範囲になる", destruction: "自分HP-2" },
        { id: "n6", name: "乱気流の支配者", attr: "WIND", dur: 9, exp: 4, type: "PASSIVE", ability: "敵配置時に1ダメを与える", destruction: "ランダム移動" },
        { id: "e1", name: "岩盾の兵", attr: "EARTH", dur: 3, exp: 1, type: "PASSIVE", ability: "囲み時さらに+1ダメージ", destruction: "なし" },
        { id: "e2", name: "根張りの精霊", attr: "EARTH", dur: 2, exp: 1, type: "PASSIVE", ability: "移動不可/受けるダメージ-1", destruction: "自分HP-1" },
        { id: "e3", name: "大地の戦士", attr: "EARTH", dur: 6, exp: 2, type: "PASSIVE", ability: "隣接味方耐久+1", destruction: "隣接味方-1耐久" },
        { id: "e4", name: "岩盤の陣形師", attr: "EARTH", dur: 5, exp: 2, type: "PASSIVE", ability: "囲み条件を緩和する", destruction: "次ターン囲み無効" },
        { id: "e5", name: "山岳巨人", attr: "EARTH", dur: 9, exp: 4, type: "PASSIVE", ability: "被ダメージ-1", destruction: "自分HP-3" },
        { id: "e6", name: "大地神の化身", attr: "EARTH", dur: 8, exp: 4, type: "PASSIVE", ability: "隣接味方は爆発ダメージ-1", destruction: "自分盤面1体破壊" },
        { id: "a1", name: "闇縛りの影", attr: "ABYSS", dur: 2, exp: 1, type: "PASSIVE", ability: "攻撃対象の特殊能力を封印", destruction: "なし" },
        { id: "a2", name: "深淵の囁き", attr: "ABYSS", dur: 3, exp: 1, type: "ACTIVE", ability: "【発動】敵の爆発ダメージ+1", destruction: "自分HP-1" },
        { id: "a3", name: "呪刻の司祭", attr: "ABYSS", dur: 4, exp: 2, type: "PASSIVE", ability: "敵爆発時に追加1ダメージ", destruction: "相手HP+1" },
        { id: "a4", name: "奈落の操者", attr: "ABYSS", dur: 5, exp: 2, type: "PASSIVE", ability: "敵による破壊効果を無効化", destruction: "自分HP-1" },
        { id: "a5", name: "深淵竜", attr: "ABYSS", dur: 8, exp: 4, type: "PASSIVE", ability: "爆発ダメージ2倍", destruction: "自分HP-3" },
        { id: "a6", name: "終焉の審判者", attr: "ABYSS", dur: 9, exp: 5, type: "PASSIVE", ability: "敵爆発時に自分のHP+1", destruction: "自分HP-4" }
    ];

    function hostRoom() {
        const id = document.getElementById('room-id-input').value;
        if(!id) return alert("IDを入力してください");
        peer = new Peer(id);
        myRole = 'p1'; isOnline = true;
        peer.on('open', () => alert("部屋作成: " + id));
        peer.on('connection', c => { conn = c; setupConn(); });
    }

    function joinRoom() {
        const id = document.getElementById('room-id-input').value;
        if(!id) return alert("IDを入力してください");
        peer = new Peer();
        myRole = 'p2'; isOnline = true;
        peer.on('open', () => { conn = peer.connect(id); setupConn(); });
    }

    function setupConn() {
        conn.on('open', () => { if(myRole==='p2') conn.send({type:'READY'}); });
        conn.on('data', data => {
            if(data.type==='READY') { initGame(); conn.send({type:'SYNC', deck: window.game.deck}); }
            else if(data.type==='SYNC') { initGame(data.deck); }
            else { window.game.receiveAction(data); }
        });
    }

    function initGame(syncedDeck = null) {
        document.getElementById('home-layer').classList.add('hidden');
        document.getElementById('game-container').style.visibility = 'visible';
        window.game = new GameCore(syncedDeck);
    }

    /* ----------------------------------------------------------------
       2. ゲームコア（ロジックの厚みを完全復元）
    ---------------------------------------------------------------- */
    class GameCore {
        constructor(syncedDeck) {
            this.board = Array(16).fill(null);
            this.hp = { p1: 25, p2: 25 };
            this.hand = { p1: [], p2: [] };
            this.deck = syncedDeck || { p1: this.shuffle([...FULL_POOL]), p2: this.shuffle([...FULL_POOL]) };
            this.turn = 1; this.currentPlayer = 'p1';
            this.deployCount = 0; this.selectedHand = null; this.selectedBoard = null;
            this.skillMode = false; this.waitingTarget = null;

            this.initBoardUI();
            this.draw('p1', 5); this.draw('p2', 5);
            this.updateUI();

            document.getElementById('end-btn').onclick = () => this.sendAction({type:'END'});
            document.getElementById('skill-btn').onclick = () => { this.skillMode = !this.skillMode; this.updateUI(); };
        }

        shuffle(a) { return a.sort(() => Math.random() - 0.5); }
        draw(p, n=1) { for(let i=0; i<n; i++) if(this.deck[p].length && this.hand[p].length < 10) this.hand[p].push({...this.deck[p].pop(), currentDur: 0, owner: p, fatigued: false, fatigueTimer: 0}); }

        initBoardUI() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for(let i=0; i<16; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => this.handleCellClick(i); b.appendChild(c);
            }
        }

        // --- 同期の要：アクション送信 ---
        sendAction(data) {
            if (isOnline && this.currentPlayer !== myRole) return;
            data.actingPlayer = this.currentPlayer; // 誰がやったか
            if (isOnline) conn.send(data);
            this.receiveAction(data);
        }

        // --- 同期の要：アクション受信・反映 ---
        receiveAction(data) {
            console.log("Action Processed:", data);
            if (data.type === 'DEPLOY') {
                const card = this.hand[data.actingPlayer].splice(data.handIdx, 1)[0];
                card.currentDur = card.dur; card.fatigued = true; card.fatigueTimer = 1;
                this.board[data.boardIdx] = card;
                if(data.actingPlayer === this.currentPlayer) this.deployCount++;
                this.log(`${data.actingPlayer}: ${card.name}を配置`);
            } else if (data.type === 'MOVE') {
                const c = this.board[data.from];
                this.board[data.to] = c; this.board[data.from] = null;
                c.fatigued = true; c.fatigueTimer = 1;
                this.log(`${c.name}が移動`);
            } else if (data.type === 'ATTACK') {
                this.executeAttack(data.from, data.to);
            } else if (data.type === 'SKILL') {
                this.executeSkill(data.ownerIdx, data.targetIdx, data.skillId);
            } else if (data.type === 'END') {
                this.nextTurn();
            }
            this.selectedHand = null; this.selectedBoard = null;
            this.updateUI();
        }

        handleCellClick(i) {
            if (isOnline && this.currentPlayer !== myRole) return;
            const card = this.board[i];
            if (card) this.showDetail(card);

            if (this.waitingTarget) {
                this.sendAction({type:'SKILL', ownerIdx: this.waitingTarget, targetIdx: i, skillId: this.board[this.waitingTarget].id});
                this.waitingTarget = null; this.skillMode = false; return;
            }

            if (this.skillMode && card && card.owner === this.currentPlayer) {
                if (['t1', 't2', 'a2'].includes(card.id)) { this.waitingTarget = i; this.log("対象を選択してください"); return; }
                if (card.id === 'n1') { this.selectedBoard = i; this.skillMode = false; this.log("移動先を選択してください"); return; }
                return;
            }

            if (this.selectedHand !== null && !card) {
                if(this.deployCount < 2) this.sendAction({type:'DEPLOY', handIdx: this.selectedHand, boardIdx: i});
                return;
            }

            if (card && card.owner === this.currentPlayer) {
                if(card.fatigued && card.id !== 't1') return;
                this.selectedBoard = (this.selectedBoard === i) ? null : i;
                this.selectedHand = null;
            } else if (this.selectedBoard !== null) {
                if (!card && this.isAdjacent(this.selectedBoard, i)) {
                    this.sendAction({type:'MOVE', from: this.selectedBoard, to: i});
                } else if (card && card.owner !== this.currentPlayer && (this.isAdjacent(this.selectedBoard, i) || this.board[this.selectedBoard].id==='n5')) {
                    this.sendAction({type:'ATTACK', from: this.selectedBoard, to: i});
                }
            }
            this.updateUI();
        }

        executeAttack(f, t) {
            const a = this.board[f], d = this.board[t];
            let dmg = 1;
            const aIdx = ATTRS.indexOf(a.attr), dIdx = ATTRS.indexOf(d.attr);
            if ((aIdx + 1) % 6 === dIdx) dmg++; // 属性
            if (this.countAdj(t, a.owner) >= 2) dmg++; // 囲み
            
            this.log(`${a.name}の攻撃！ ${d.name}に${dmg}ダメージ`);
            this.applyDamage(t, dmg);
            a.fatigued = true; a.fatigueTimer = (a.id === 't5' ? 1 : 2);
        }

        applyDamage(i, val) {
            const c = this.board[i]; if(!c) return;
            c.currentDur -= val;
            if(c.currentDur <= 0) this.explode(i);
        }

        explode(i) {
            const c = this.board[i];
            this.hp[c.owner] -= c.exp;
            this.log(`${c.name}爆発！ ${c.owner}に${c.exp}ダメージ`);
            this.board[i] = null;
            if(this.hp.p1 <= 0 || this.hp.p2 <= 0) { alert("GAME OVER"); location.reload(); }
        }

        executeSkill(o, t, id) {
            const owner = this.board[o], target = this.board[t];
            if (id === 't1' && target) { target.fatigued = false; target.fatigueTimer = 0; }
            if (id === 't2' && target) { target.fatigued = true; target.fatigueTimer = 2; }
            owner.fatigued = true; owner.fatigueTimer = 1;
            this.log(`${owner.name}のスキル発動`);
        }

        nextTurn() {
            this.currentPlayer = (this.currentPlayer === 'p1') ? 'p2' : 'p1';
            if(this.currentPlayer === 'p1') this.turn++;
            this.deployCount = 0; this.draw(this.currentPlayer);
            this.board.forEach(c => { if(c && c.owner === this.currentPlayer && c.fatigued) { c.fatigueTimer--; if(c.fatigueTimer <= 0) c.fatigued = false; } });
            this.log(`${this.currentPlayer.toUpperCase()}のターン開始`);
        }

        isAdjacent(a, b) { return Math.abs(a%4 - b%4) + Math.abs(Math.floor(a/4) - Math.floor(b/4)) === 1; }
        countAdj(idx, owner) {
            let n = 0; const x = idx%4, y = Math.floor(idx/4);
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy]) => {
                const nx=x+dx, ny=y+dy;
                if(nx>=0 && nx<4 && ny>=0 && ny<4 && this.board[ny*4+nx]?.owner === owner) n++;
            }); return n;
        }

        log(m) { const l = document.getElementById('log'); l.innerHTML = `<div>> ${m}</div>` + l.innerHTML; }
        showDetail(c) { document.getElementById('detail-panel').innerHTML = `<b>${c.name}</b> [${c.attr}]<br>HP: ${c.currentDur}/${c.dur}<br>効果: ${c.ability}`; }

        updateUI() {
            document.getElementById('p1-hp').innerText = this.hp.p1;
            document.getElementById('p2-hp').innerText = this.hp.p2;
            document.getElementById('turn-display').innerText = `TURN ${this.turn} - ${this.currentPlayer.toUpperCase()}`;
            document.getElementById('deploy-limit').innerText = (2 - this.deployCount);

            document.querySelectorAll('.cell').forEach((cell, i) => {
                cell.className = 'cell' + (this.selectedBoard === i ? ' highlight' : '');
                cell.innerHTML = '';
                const c = this.board[i];
                if (c) {
                    const el = document.createElement('div');
                    el.className = `card-on-board attr-${c.attr.toLowerCase()} owner-${c.owner} ${c.fatigued ? 'fatigued' : ''}`;
                    el.innerHTML = `<div style="font-weight:bold">${c.name}</div><div class="hp-bar-small">HP ${c.currentDur}</div>`;
                    if(c.fatigued) { const t = document.createElement('div'); t.className='fatigue-timer'; t.innerText=c.fatigueTimer; el.appendChild(t); }
                    cell.appendChild(el);
                }
            });

            const handEl = document.getElementById('hand'); handEl.innerHTML = '';
            // 重要：オンライン時は自分の手札、ローカル時は現在のプレイヤーの手札を表示
            const viewP = isOnline ? myRole : this.currentPlayer;
            this.hand[viewP].forEach((c, i) => {
                const d = document.createElement('div');
                d.className = `card-ui attr-${c.attr.toLowerCase()} ${this.selectedHand === i ? 'selected' : ''}`;
                d.innerHTML = `<b>${c.name}</b><br><small>耐:${c.dur} 爆:${c.exp}</small>`;
                d.onclick = (e) => {
                    if (isOnline && this.currentPlayer !== myRole) return;
                    e.stopPropagation(); this.selectedHand = (this.selectedHand === i) ? null : i; this.updateUI();
                };
                handEl.appendChild(d);
            });
        }
    }
</script>
</body>
</html>
